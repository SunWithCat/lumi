name: lumi
description: "Lumi - AI Virtual Companion"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  # 状态管理
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  flutter_hooks: ^0.20.5
  hooks_riverpod: ^2.6.1
  
  # 数据库 (记忆系统)
  drift: ^2.22.1
  sqlite3_flutter_libs: ^0.5.28
  path_provider: ^2.1.5
  path: ^1.9.1
  
  # 网络 (LLM API)
  dio: ^5.7.0
  
  # 序列化
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  
  # 工具
  uuid: ^4.5.1
  logger: ^2.5.0
  equatable: ^2.0.7
  
  # 动画
  flutter_animate: ^4.5.2

  flutter_localizations:
    sdk: flutter
  toastification: ^3.0.3

  # 路由
  go_router: ^17.0.0
  crypto: ^3.0.7

  # 图标
  font_awesome_flutter: ^10.9.1

  # 传送
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1
  
  # 代码生成
  build_runner: ^2.4.13
  riverpod_generator: ^2.6.3
  freezed: ^2.5.7
  json_serializable: ^6.9.0
  drift_dev: ^2.22.1

flutter:
  uses-material-design: true
  assets:
    - assets/lumi_icon.png

flutter_launcher_icons:
  android: "launcher_icon" # 自动生成 Android 图标
  ios: true                # 自动生成 iOS 图标
  image_path: "assets/lumi_icon.png" # 刚才存放的图片路径
